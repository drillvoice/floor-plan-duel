<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floor Plan Duel</title>
    <meta name="theme-color" content="#16181f" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #16181f;
      }
      canvas {
        display: block;
      }
      #editor-toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 64px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        box-sizing: border-box;
        overflow-x: auto;
        font: 14px system-ui, sans-serif;
      }
      #editor-toolbar[hidden] {
        display: none;
      }
      #editor-toolbar input[type='text'],
      #editor-toolbar select,
      #editor-toolbar button {
        font: inherit;
        color: #f2efe8;
        background: #262a35;
        border: 1px solid #3a3f4d;
        border-radius: 6px;
        padding: 7px 12px;
      }
      #editor-toolbar input[type='text'] {
        width: 160px;
      }
      #editor-toolbar button {
        cursor: pointer;
        white-space: nowrap;
      }
      #editor-toolbar .save-status {
        color: #8b90a0;
        white-space: nowrap;
        margin-left: 4px;
      }
      #editor-toolbar .save-status[data-state='saved'] {
        color: #7ed957;
      }
      #editor-toolbar .save-status[data-state='failed'] {
        color: #ff4d4d;
      }
      #editor-toolbar button:hover,
      #editor-toolbar select:hover {
        background: #323746;
      }
      #fullscreen {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        padding: 0;
        color: #8b90a0;
        background: #262a35;
        border: 1px solid #3a3f4d;
        border-radius: 8px;
        cursor: pointer;
      }
      #fullscreen:hover {
        color: #f2efe8;
        background: #323746;
      }
      #fullscreen[hidden] {
        display: none;
      }
      #fullscreen .exit,
      #fullscreen.on .enter {
        display: none;
      }
      #fullscreen.on .exit {
        display: block;
      }
      #hotseat {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 32px 16px;
        box-sizing: border-box;
        font: 15px system-ui, sans-serif;
        color: #f2efe8;
      }
      #hotseat[hidden] {
        display: none;
      }
      #hotseat .panel {
        width: 100%;
        max-width: 720px;
      }
      #hotseat h1 {
        font-size: 40px;
        font-weight: 800;
        margin: 0;
      }
      #hotseat .sub,
      #hotseat .hint,
      #hotseat .last {
        color: #8b90a0;
        margin: 6px 0 18px;
      }
      #hotseat .last {
        color: #f2efe8;
      }
      #hotseat .up-next {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        background: #262a35;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 12px;
      }
      #hotseat .up-next.empty {
        display: block;
        text-align: center;
        color: #8b90a0;
      }
      #hotseat .fighter {
        text-align: center;
      }
      #hotseat .fighter .look.big {
        width: 56px;
        height: 56px;
        margin: 0 auto 6px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 32px;
      }
      #hotseat .side-0 .look.big {
        background: #7ed957;
      }
      #hotseat .side-1 .look.big {
        background: #c084fc;
      }
      #hotseat .fighter-name {
        font-size: 22px;
        font-weight: 700;
      }
      #hotseat .side-0 .fighter-name {
        color: #7ed957;
      }
      #hotseat .side-1 .fighter-name {
        color: #c084fc;
      }
      #hotseat .keys {
        color: #8b90a0;
        font-size: 13px;
        margin-top: 4px;
      }
      #hotseat .vs {
        font-size: 20px;
        font-weight: 800;
        color: #8b90a0;
      }
      #hotseat table {
        width: 100%;
        border-collapse: collapse;
        margin: 8px 0 12px;
      }
      #hotseat th {
        text-align: left;
        color: #8b90a0;
        font-weight: 500;
        font-size: 13px;
        padding: 4px 6px;
      }
      #hotseat td {
        padding: 4px 6px;
        border-top: 1px solid #262a35;
      }
      #hotseat tr.playing td {
        background: rgba(255, 255, 255, 0.03);
      }
      #hotseat td.where {
        color: #8b90a0;
        font-size: 13px;
        white-space: nowrap;
      }
      #hotseat td.num {
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      #hotseat button,
      #hotseat input[type='text'] {
        font: inherit;
        color: #f2efe8;
        background: #262a35;
        border: 1px solid #3a3f4d;
        border-radius: 6px;
        padding: 7px 12px;
      }
      #hotseat button {
        cursor: pointer;
      }
      #hotseat button:hover:not(:disabled) {
        background: #323746;
      }
      #hotseat button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #hotseat td.name input {
        width: 170px;
        box-sizing: border-box;
        background: transparent;
        border-color: transparent;
      }
      #hotseat td.name input:hover,
      #hotseat td.name input:focus {
        border-color: #3a3f4d;
      }
      #hotseat button.look {
        font-size: 20px;
        padding: 2px 8px;
        line-height: 1.4;
      }
      #hotseat button.remove {
        background: transparent;
        border-color: transparent;
        color: #8b90a0;
      }
      #hotseat .add {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      #hotseat .add input {
        flex: 1;
        min-width: 0;
      }
      #hotseat .lengths {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 18px;
        color: #8b90a0;
      }
      #hotseat .lengths button.on {
        background: #f2efe8;
        color: #16181f;
      }
      #hotseat .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #hotseat button.primary {
        background: #7ed957;
        border-color: #7ed957;
        color: #16181f;
        font-weight: 700;
      }
      #hotseat button.primary:hover:not(:disabled) {
        background: #95e573;
      }
      #phones {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 32px 16px;
        box-sizing: border-box;
        font: 15px system-ui, sans-serif;
        color: #f2efe8;
      }
      #phones[hidden] {
        display: none;
      }
      #phones .panel {
        width: 100%;
        max-width: 720px;
      }
      #phones h1 {
        font-size: 40px;
        font-weight: 800;
        margin: 0;
      }
      #phones .sub,
      #phones .hint {
        color: #8b90a0;
        margin: 6px 0 18px;
      }
      #phones .join {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 24px;
        background: #262a35;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 12px;
      }
      #phones .qr {
        width: 180px;
        height: 180px;
        flex: none;
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
      }
      #phones .qr svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #phones .join-text {
        flex: 1;
        min-width: 220px;
      }
      #phones .code-label {
        color: #8b90a0;
        font-size: 13px;
      }
      #phones .code {
        font-size: 56px;
        font-weight: 800;
        letter-spacing: 0.12em;
        line-height: 1.1;
      }
      #phones .code.dim {
        opacity: 0.35;
      }
      #phones .url {
        color: #8b90a0;
        font-size: 13px;
        word-break: break-all;
      }
      #phones .status {
        margin: 10px 0 0;
        color: #8b90a0;
      }
      #phones .status.offline,
      #phones .warn {
        color: #ffb347;
      }
      #phones .warn {
        margin: 8px 0 0;
        font-size: 13px;
      }
      #phones .seats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 18px;
      }
      #phones .seat {
        text-align: center;
        background: #262a35;
        border: 2px solid transparent;
        border-radius: 12px;
        padding: 18px 12px;
        opacity: 0.7;
      }
      #phones .seat.joined {
        border-color: #3a3f4d;
        opacity: 1;
      }
      #phones .look.big {
        width: 56px;
        height: 56px;
        margin: 0 auto 6px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 32px;
      }
      #phones .seat-name {
        font-size: 22px;
        font-weight: 700;
      }
      #phones .seat-note {
        color: #8b90a0;
        font-size: 13px;
        margin-top: 4px;
      }
      #phones .actions {
        display: flex;
        gap: 8px;
      }
      #phones button {
        font: inherit;
        color: #f2efe8;
        background: #262a35;
        border: 1px solid #3a3f4d;
        border-radius: 6px;
        padding: 7px 12px;
        cursor: pointer;
      }
      #phones button:hover {
        background: #323746;
      }
      #phones button.primary {
        background: #7ed957;
        border-color: #7ed957;
        color: #16181f;
        font-weight: 700;
      }
      #phones button.primary:hover {
        background: #95e573;
      }
      #ready-banner {
        position: fixed;
        top: 24px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        box-sizing: border-box;
        padding: 10px 20px;
        border-radius: 12px;
        background: rgba(22, 24, 31, 0.85);
        border: 1px solid #3a3f4d;
        color: #f2efe8;
        font: 600 18px system-ui, sans-serif;
        text-align: center;
        white-space: pre-wrap;
        pointer-events: none;
      }
      #ready-banner[hidden] {
        display: none;
      }
      #ready-banner .count {
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
        color: #7ed957;
      }
      #mobile {
        position: fixed;
        inset: 0;
        overflow-y: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 16px;
        box-sizing: border-box;
        font: 15px system-ui, sans-serif;
        color: #f2efe8;
        -webkit-tap-highlight-color: transparent;
      }
      #mobile[hidden],
      #touch[hidden],
      #touch .pad[hidden] {
        display: none;
      }
      #mobile .panel {
        width: 100%;
        max-width: 760px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px 24px;
        margin: auto 0;
      }
      #mobile .col {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #mobile h1 {
        font-size: 30px;
        font-weight: 800;
        margin: 0;
      }
      #mobile .sub,
      #mobile .label,
      #mobile .controller {
        color: #8b90a0;
        margin: 0;
        font-size: 14px;
      }
      #mobile .label {
        margin-top: 4px;
      }
      #mobile button,
      #mobile input,
      #touch button {
        font: inherit;
        color: #f2efe8;
        background: #262a35;
        border: 1px solid #3a3f4d;
        border-radius: 10px;
        padding: 10px 14px;
      }
      #mobile input {
        flex: 1;
        min-width: 0;
        font-size: 16px;
      }
      #mobile button.on {
        border-color: #7ed957;
        color: #7ed957;
      }
      #mobile button.primary,
      #touch button.primary {
        background: #7ed957;
        border-color: #7ed957;
        color: #16181f;
        font-weight: 800;
      }
      #mobile .play {
        font-size: 22px;
        padding: 14px;
      }
      #mobile .look-row,
      #mobile .map-row,
      #mobile .choices {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #mobile .choices button {
        flex: 1;
      }
      #mobile .arrow {
        flex: none;
        width: 44px;
        padding: 10px 0;
      }
      #mobile .face {
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 28px;
      }
      #mobile .map-name {
        flex: 1;
        text-align: center;
        font-weight: 600;
      }
      #touch {
        position: fixed;
        inset: 0;
        font: 15px system-ui, sans-serif;
        color: #f2efe8;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #touch .pad {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      #touch .zone-label {
        opacity: 0.5;
      }
      /* Smaller and see-through, so they cover as little of the arena as possible. */
      #touch .btn {
        opacity: 0.6;
      }
      #touch .btn.shoot {
        right: 3%;
        bottom: 10%;
        width: min(28vmin, 130px);
        height: min(28vmin, 130px);
        font-size: 16px;
      }
      #touch .btn.dodge {
        right: calc(3% + min(28vmin, 130px) + 2%);
        bottom: calc(10% + min(14vmin, 65px));
        width: min(20vmin, 96px);
        height: min(20vmin, 96px);
        font-size: 13px;
        background: rgba(255, 255, 255, 0.08);
      }
      #touch .pause {
        position: absolute;
        top: 4px;
        left: 4px;
        padding: 4px 12px;
        font-size: 13px;
        opacity: 0.8;
      }
      #touch .actions {
        position: absolute;
        left: 0;
        right: 0;
        top: 62%;
        display: flex;
        justify-content: center;
        gap: 12px;
      }
      #touch .actions.over {
        top: auto;
        bottom: 12px;
      }
      #touch .actions button {
        min-width: 130px;
        font-size: 18px;
        padding: 12px 18px;
      }
      #touch .rotate {
        display: none;
      }
      @media (orientation: portrait) {
        #touch .rotate {
          position: absolute;
          inset: 0;
          display: grid;
          place-content: center;
          text-align: center;
          background: #16181f;
          font-size: 20px;
          font-weight: 700;
        }
        #touch .rotate-icon {
          font-size: 56px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <button id="fullscreen" type="button" tabindex="-1" title="Full screen (B)" aria-label="Toggle full screen" hidden>
      <svg class="enter" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" />
      </svg>
      <svg class="exit" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 3v4H3M17 7h-4V3M13 17v-4h4M3 13h4v4" />
      </svg>
    </button>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
